name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Builds, then runs `node --test dist/test/*.test.js` (files listed explicitly).
      - run: npm test
      - name: CLI smoke test
        env:
          META_APP_SECRET: ci-app-secret
          META_VERIFY_TOKEN: ci-verify-token
          META_PAGE_ACCESS_TOKEN: ci-page-token
          ADMIN_TOKEN: ci-admin-token-0123456789
          GOOGLE_SPREADSHEET_ID: ci-sheet
          N8N_WEBHOOK_URL: https://n8n.example.com/webhook/ci
          N8N_WEBHOOK_SECRET: ci-secret
          TELEGRAM_BOT_TOKEN: "123456:ci-token"
          TELEGRAM_CHAT_ID: "-100123"
        run: |
          node dist/src/cli.js --version
          node dist/src/cli.js check-config --config examples/config.example.json
          node dist/src/cli.js phone 01712-345678 "+880 1812 345678"
          node dist/src/cli.js sign examples/sample-webhook.json
          node dist/src/cli.js route examples/sample-lead.json --config examples/config.example.json
          node examples/library-usage.mjs

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t meta-lead-ads-sync:ci .
      - run: docker run --rm meta-lead-ads-sync:ci --version
      - name: Compose file is valid
        working-directory: deploy
        run: |
          cp .env.example .env
          docker compose config --quiet
